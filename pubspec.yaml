name: sanggar_mulya_bhakti
description: Aplikasi resmi Sanggar Mulya Bhakti - Pelestarian Budaya Tari Indramayu
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  http: ^1.2.0

  # State management
  provider: ^6.1.1

  # Storage
  shared_preferences: ^2.2.2

  # Image
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Fonts
  google_fonts: ^6.1.0

  # Slider indicator
  smooth_page_indicator: ^1.1.0

  # Utils
  intl: ^0.19.0

  # QR Scanner untuk absensi
  mobile_scanner: ^5.0.0

  # Permission handler
  permission_handler: ^11.3.1
  image_picker: ^1.2.2
  url_launcher: ^6.3.2
  youtube_player_flutter: ^9.1.3

flutter:
  uses-material-design: true